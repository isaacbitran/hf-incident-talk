<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAIST Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,600;0,700;1,700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  :root{--bg:#0B0B0B;--fg:#FFFFFF;--fg-2:#9A9A9A}
  *{box-sizing:border-box}
  html,body{margin:0;background:#1a1a1a}
  body{display:flex;justify-content:center;padding:32px 0}
  html.shot body{padding:0;justify-content:flex-start;background:var(--bg)}

  /* Letter sheet, 850x1100 */
  .sheet{width:850px;height:1100px;background:var(--bg);color:var(--fg);padding:72px 72px 64px;
    display:flex;flex-direction:column;justify-content:space-between;font-family:"Afacad",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}

  .logo{display:flex;align-items:center;gap:16px}
  .logo svg{width:64px;height:64px;overflow:visible}
  .logo span{font-weight:600;font-size:30px;line-height:1}

  h1{margin:0 0 0 -6px;font-weight:700;text-transform:uppercase;font-size:132px;line-height:.86;letter-spacing:-.035em}
  h1 em{font-style:italic}

  .chip{margin:0 0 0 -4px;font-weight:700;text-transform:uppercase;font-size:104px;line-height:.9;letter-spacing:-.03em;white-space:nowrap}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:32px}
  .where{font-weight:700;font-size:58px;line-height:.95;letter-spacing:-.02em;margin:0}
  .when{font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-2);margin:16px 0 0}
  .qr{width:180px;height:180px;background:#fff;padding:12px;flex:none}
  .qr img,.qr canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<main class="sheet">
  <div class="logo" aria-label="Brown AI Safety Team">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <g stroke-width="4.5">
        <line x1="70" y1="22" x2="24" y2="4"/>
        <line x1="70" y1="22" x2="74" y2="2"/>
        <line x1="70" y1="22" x2="90" y2="9"/>
        <line x1="70" y1="22" x2="96" y2="25"/>
        <line x1="70" y1="22" x2="46" y2="22"/>
        <line x1="70" y1="22" x2="86" y2="37"/>
      </g>
      <line x1="70" y1="22" x2="78" y2="40"/>
      <circle cx="80" cy="53" r="11"/>
      <circle cx="21" cy="53" r="11"/>
      <line x1="32" y1="53" x2="69" y2="53"/>
      <line x1="70" y1="60" x2="34" y2="82"/>
      <circle cx="21" cy="89" r="14.5" fill="currentColor" stroke="none"/>
    </svg>
    <span>Brown AI Safety Team</span>
  </div>

  <h1>What could <em>go wrong</em> with AI?</h1>

  <p class="chip">Free Chipotle.</p>

  <div class="foot">
    <div>
      <p class="where">Come to<br>the Underground.</p>
      <p class="when">Tue Sept 29 · 6 PM</p>
    </div>
    <div class="qr" id="qr"></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  if (new URLSearchParams(location.search).has('shot')) document.documentElement.classList.add('shot');
  // Hardcoded public URL — never location.origin (a local render would print a dead localhost QR).
  const POSTER_URL = 'https://hf-incident.vercel.app/';
  new QRCode(document.getElementById('qr'), { text: POSTER_URL, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.H });
</script>
</body>
</html>
